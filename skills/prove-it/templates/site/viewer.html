<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proof</title>
<style>
:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --border: #e5e7eb;
  --border-strong: #d1d5db;
  --text: #111827;
  --text-muted: #6b7280;
  --accent: #4f46e5;
  --accent-light: #eef2ff;
  --pass: #16a34a;
  --pass-bg: #dcfce7;
  --warn: #d97706;
  --warn-bg: #fef3c7;
  --fail: #dc2626;
  --fail-bg: #fee2e2;
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.04);
  --shadow: 0 1px 3px rgb(0 0 0 / 0.06), 0 1px 2px rgb(0 0 0 / 0.04);
  --radius: 6px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 64rem;
  margin: 0 auto;
  padding: 0 1.5rem;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

h1, h2, h3 { color: var(--text); line-height: 1.25; }

code {
  font-family: var(--font-mono);
  font-size: 0.88em;
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 0.08rem 0.35rem;
  border-radius: 3px;
}

.muted { color: var(--text-muted); }

/* nav */
.site-nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0.65rem 0;
  position: sticky;
  top: 0;
  z-index: 50;
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}
.nav-logo {
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--text);
  letter-spacing: -0.01em;
}
.nav-logo:hover { text-decoration: none; }
.nav-run {
  font-size: 0.8rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

/* hero */
.hero { padding: 2.25rem 0 1.5rem; }
.hero h1 {
  font-size: 1.75rem;
  font-weight: 700;
  letter-spacing: -0.015em;
  margin: 0 0 0.25rem;
}
.hero .app-version {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-left: 0.4rem;
  font-weight: 400;
}
.hero-sub {
  font-size: 0.95rem;
  color: var(--text-muted);
  margin: 0 0 0.4rem;
}
.hero .env {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin: 0 0 1rem;
}
.overall {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.3rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 999px;
  font-weight: 500;
  font-size: 0.85rem;
  background: var(--surface);
}
.overall::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.8;
}
.overall.status-pass { color: var(--pass); border-color: var(--pass-bg); background: var(--pass-bg); }
.overall.status-warn { color: var(--warn); border-color: var(--warn-bg); background: var(--warn-bg); }
.overall.status-fail { color: var(--fail); border-color: var(--fail-bg); background: var(--fail-bg); }

/* counts */
.counts {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.75rem;
  margin: 0 0 1.25rem;
}
.count-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.75rem 1rem;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.5rem;
}
.count-num {
  font-size: 1.5rem;
  font-weight: 600;
  line-height: 1;
  color: var(--text);
}
.count-label { font-size: 0.8rem; color: var(--text-muted); }
.count-card.pass .count-num { color: var(--pass); }
.count-card.warn .count-num { color: var(--warn); }
.count-card.fail .count-num { color: var(--fail); }

/* status pill */
.status {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.12rem 0.55rem;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  border: 1px solid transparent;
}
.status-pass { background: var(--pass-bg); color: var(--pass); }
.status-warn { background: var(--warn-bg); color: var(--warn); }
.status-fail { background: var(--fail-bg); color: var(--fail); }

/* feedback hint */
.feedback-hint {
  background: var(--accent-light);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.7rem 0.9rem;
  margin: 0 0 1.25rem;
  font-size: 0.88rem;
  color: var(--text);
}
.feedback-hint strong { color: var(--accent); font-weight: 600; }

/* findings */
.findings {
  background: var(--warn-bg);
  border: 1px solid var(--border);
  border-left: 3px solid var(--warn);
  border-radius: var(--radius);
  padding: 0.85rem 1.1rem;
  margin: 0 0 1.25rem;
}
.findings h2 {
  font-size: 0.95rem;
  margin: 0 0 0.5rem;
  font-weight: 600;
}
.findings ul { list-style: none; margin: 0; padding: 0; }
.findings li {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  padding: 0.25rem 0;
  font-size: 0.88rem;
  flex-wrap: wrap;
}
.findings li + li { border-top: 1px solid rgb(0 0 0 / 0.05); }
.findings .observed { color: var(--text-muted); }

/* TOC */
.toc {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.85rem 1.1rem;
  margin: 0 0 1.5rem;
  box-shadow: var(--shadow-sm);
}
.toc h2 {
  font-size: 0.95rem;
  font-weight: 600;
  margin: 0 0 0.5rem;
}
.toc ol {
  list-style: none;
  margin: 0;
  padding: 0;
}
.toc li {
  display: grid;
  grid-template-columns: 2rem auto 1fr auto;
  align-items: center;
  gap: 0.6rem;
  padding: 0.45rem 0;
  font-size: 0.92rem;
  border-top: 1px solid var(--border);
}
.toc li:first-child { border-top: none; padding-top: 0.25rem; }
.toc-num {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--text-muted);
}
.toc-link {
  color: var(--text);
  text-decoration: none;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.toc-link:hover { color: var(--accent); text-decoration: underline; }
.toc-duration {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--text-muted);
  text-align: right;
}

/* scenarios */
.scenarios { margin: 0 0 1.5rem; }
.scenario {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.5rem;
  margin: 0 0 1.25rem;
  box-shadow: var(--shadow-sm);
  scroll-margin-top: 5rem;
}
.scenario:target {
  border-color: var(--accent);
  box-shadow: var(--shadow), 0 0 0 3px var(--accent-light);
}
.scenario-head {
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  flex-wrap: wrap;
  margin: 0 0 0.5rem;
}
.scenario-head h2 {
  font-size: 1.15rem;
  font-weight: 600;
  margin: 0;
  flex: 1 1 auto;
  min-width: 0;
}
.scenario-head .duration {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--text-muted);
}
.narrative { margin: 0 0 0.85rem; color: var(--text); }

/* expected / observed */
.exp-obs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
  margin: 0.85rem 0;
  font-size: 0.9rem;
}
@media (max-width: 700px) { .exp-obs { grid-template-columns: 1fr; } }
.exp, .obs {
  padding: 0.65rem 0.85rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}
.exp { border-left: 3px solid var(--accent); }
.exp strong { color: var(--accent); font-weight: 600; }
.obs { border-left: 3px solid var(--warn); background: #fffdf7; }
.obs strong { color: var(--warn); font-weight: 600; }

/* video */
.video-figure { margin: 0.85rem 0 1rem; scroll-margin-top: 5rem; }
.video-figure video {
  width: 100%;
  max-width: 56rem;
  display: block;
  background: #000;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.video-figure figcaption {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-top: 0.35rem;
  display: flex;
  align-items: center;
  gap: 0.25rem;
}
.video-figure:target video {
  outline: 3px solid var(--accent-light);
  outline-offset: 2px;
}

/* screenshots */
.shots {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 0.85rem;
  margin: 0.5rem 0 0.85rem;
}
.shot { margin: 0; scroll-margin-top: 5rem; }
.shot a { display: block; }
.shot img {
  width: 100%;
  height: auto;
  display: block;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: border-color 0.12s ease;
}
.shot a:hover img { border-color: var(--border-strong); }
.shot:target img {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}
.shot figcaption {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-top: 0.35rem;
  display: flex;
  align-items: center;
  gap: 0.25rem;
}

/* notes */
.notes {
  background: var(--warn-bg);
  border: 1px solid var(--border);
  border-left: 3px solid var(--warn);
  border-radius: var(--radius);
  padding: 0.6rem 0.85rem;
  margin: 0.85rem 0 0;
  font-size: 0.88rem;
}
.notes strong { color: var(--warn); font-weight: 600; }

/* permalink */
.permalink {
  color: var(--text-muted);
  font-weight: 500;
  font-size: 0.85em;
  font-family: var(--font-mono);
  text-decoration: none;
  opacity: 0.4;
  transition: opacity 0.12s ease, color 0.12s ease;
  padding: 0 0.15rem;
}
.permalink:hover, .permalink:focus {
  opacity: 1;
  color: var(--accent);
  text-decoration: none;
}

/* next step */
.next-step {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--warn);
  border-radius: var(--radius);
  padding: 1.1rem 1.4rem;
  margin: 0 0 1.5rem;
}
.next-step h2 {
  font-size: 1.05rem;
  font-weight: 600;
  margin: 0 0 0.4rem;
}
.next-step p { margin: 0.4rem 0; font-size: 0.92rem; }
.next-step ol {
  margin: 0.6rem 0;
  padding-left: 1.4rem;
  font-size: 0.92rem;
}
.next-step li { margin: 0.3rem 0; }
.next-step strong { color: var(--accent); font-weight: 600; }

/* empty / error */
.empty, .error { text-align: center; padding: 3rem 1rem; }
.empty h1, .error h1 {
  font-size: 1.75rem;
  font-weight: 700;
  letter-spacing: -0.015em;
  margin: 0 0 0.5rem;
}
.empty p, .error p { color: var(--text-muted); max-width: 36rem; margin: 0 auto; font-size: 0.92rem; }
.empty code, .error code { display: inline-block; margin-top: 0.5rem; }
.error p { color: var(--fail); }

/* footer */
footer {
  border-top: 1px solid var(--border);
  padding: 1.25rem 0;
  text-align: center;
  font-size: 0.8rem;
  color: var(--text-muted);
}

@media (max-width: 768px) {
  .hero { padding: 1.75rem 0 1rem; }
  .hero h1 { font-size: 1.5rem; }
  .counts { grid-template-columns: 1fr; }
  .scenario { padding: 1rem 1.1rem; }
  .toc li { grid-template-columns: 1.5rem auto 1fr; }
  .toc-duration { display: none; }
}
</style>
</head>
<body>

<header class="site-nav">
  <div class="container nav-inner">
    <a href="#top" class="nav-logo">Proof</a>
    <span class="nav-run" id="navRun"></span>
  </div>
</header>

<main id="top">
  <div id="root"><div class="empty"><h1>Proof</h1><p>Loading…</p></div></div>
</main>

<footer>
  <div class="container">
    <p>Generated by the <a href="https://github.com/dvhthomas/prove-it">prove-it</a> skill. Open this page directly via <code>file://</code> — no server required.</p>
  </div>
</footer>

<script type="application/json" id="metadata">
{
  "_placeholder": true,
  "run_id": "(not yet populated)",
  "app": { "name": "Proof viewer", "version": "", "url_or_command": "" },
  "environment": { "os": "", "browser": "" },
  "scenarios": []
}
</script>

<script>
(function () {
  "use strict";

  var STATUS = {
    "pass":            { cls: "pass", label: "Pass" },
    "needs-attention": { cls: "warn", label: "Needs attention" },
    "fail":            { cls: "fail", label: "Fail" }
  };

  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function permalink(anchor, label) {
    return '<a class="permalink" href="#' + esc(anchor) + '" title="Copy link to this ' + esc(label) + '">#</a>';
  }

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  function renderEmpty() {
    return (
      '<div class="empty">' +
      '<h1>Proof</h1>' +
      '<p>This is the bare viewer template. Replace the JSON inside ' +
      '<code>&lt;script type="application/json" id="metadata"&gt;</code> ' +
      "with your run's real metadata, then reload.</p>" +
      "</div>"
    );
  }

  function renderScenario(s) {
    var slug = esc(s.slug || "scenario");
    var title = esc(s.title || s.slug || "Scenario");
    var narrative = esc(s.narrative || "");
    var notes = esc(s.notes || "");
    var expected = esc(s.expected || "");
    var observed = esc(s.observed || "");
    var dur = (typeof s.duration_seconds === "number") ? Math.round(s.duration_seconds) + "s" : "";
    var st = STATUS[s.status] || STATUS.pass;

    var html = '<article class="scenario" id="' + slug + '">';
    html += '<header class="scenario-head">';
    html += '<span class="status status-' + st.cls + '">' + st.label + "</span>";
    html += "<h2>" + title + " " + permalink(slug, "scenario") + "</h2>";
    if (dur) html += '<span class="duration">' + dur + "</span>";
    html += "</header>";
    if (narrative) html += '<p class="narrative">' + narrative + "</p>";

    if (expected || observed) {
      html += '<div class="exp-obs">';
      if (expected) html += '<div class="exp"><strong>Expected:</strong> ' + expected + "</div>";
      if (observed) html += '<div class="obs"><strong>Observed:</strong> ' + observed + "</div>";
      html += "</div>";
    }

    if (s.video) {
      var v = esc(s.video);
      var vId = slug + "--video";
      html += '<figure id="' + vId + '" class="video-figure">';
      html += '<video controls preload="metadata" src="' + v + '">';
      html += 'Your browser cannot play this video. Open <a href="' + v + '">' + v + "</a> directly.";
      html += "</video>";
      html += '<figcaption><span>Video</span> ' + permalink(vId, "video") + "</figcaption>";
      html += "</figure>";
    }

    var shots = s.screenshots || [];
    if (shots.length) {
      html += '<div class="shots">';
      shots.forEach(function (shot, i) {
        var file = esc(shot.file || "");
        var caption = esc(shot.caption || "");
        var sid = slug + "--shot-" + pad2(i + 1);
        html += '<figure class="shot" id="' + sid + '">';
        html += '<a href="' + file + '" target="_blank"><img src="' + file + '" alt="' + caption + '" loading="lazy"></a>';
        html += '<figcaption><span>' + caption + "</span> " + permalink(sid, "screenshot") + "</figcaption>";
        html += "</figure>";
      });
      html += "</div>";
    }

    if (notes) html += '<p class="notes"><strong>Notes:</strong> ' + notes + "</p>";
    html += "</article>";
    return html;
  }

  function render(meta) {
    var scenarios = (meta && meta.scenarios) || [];
    if (meta && meta._placeholder) return renderEmpty();
    if (!scenarios.length) return renderEmpty();

    var counts = { pass: 0, "needs-attention": 0, fail: 0 };
    scenarios.forEach(function (s) {
      if (counts[s.status] != null) counts[s.status]++;
    });

    var overall;
    if (counts.fail) overall = { cls: "fail", label: counts.fail + " failed" };
    else if (counts["needs-attention"]) overall = { cls: "warn", label: counts["needs-attention"] + " need attention" };
    else overall = { cls: "pass", label: "All scenarios passed" };

    var app = meta.app || {};
    var env = meta.environment || {};
    var hasIssues = counts.fail + counts["needs-attention"] > 0;

    var navRun = document.getElementById("navRun");
    if (navRun) navRun.textContent = meta.run_id ? "run · " + meta.run_id : "";

    var html = "";

    html += '<section class="hero"><div class="container">';
    html += "<h1>" + esc(app.name || "Proof");
    if (app.version) html += '<span class="app-version">' + esc(app.version) + "</span>";
    html += "</h1>";
    html += '<p class="hero-sub">run <code>' + esc(meta.run_id || "") + "</code></p>";
    var envBits = [];
    if (env.os) envBits.push(esc(env.os));
    if (env.browser) envBits.push(esc(env.browser));
    if (app.url_or_command) envBits.push("target <code>" + esc(app.url_or_command) + "</code>");
    if (envBits.length) html += '<p class="env">' + envBits.join(" · ") + "</p>";
    html += '<div class="overall status-' + overall.cls + '">' + esc(overall.label) + "</div>";
    html += "</div></section>";

    html += '<section><div class="container">';

    // counts
    html += '<div class="counts">';
    html += '<div class="count-card pass"><span class="count-num">' + counts.pass + '</span><span class="count-label">passed</span></div>';
    html += '<div class="count-card warn"><span class="count-num">' + counts["needs-attention"] + '</span><span class="count-label">need attention</span></div>';
    html += '<div class="count-card fail"><span class="count-num">' + counts.fail + '</span><span class="count-label">failed</span></div>';
    html += "</div>";

    // feedback hint
    html += '<div class="feedback-hint"><strong>Want to give precise feedback?</strong> Right-click the <code>#</code> next to any scenario, video, or screenshot, copy the link, and paste it back into our conversation with what you expected.</div>';

    // findings
    if (hasIssues) {
      html += '<div class="findings"><h2>Things that need your attention</h2><ul>';
      scenarios.forEach(function (s) {
        if (s.status === "pass") return;
        var st = STATUS[s.status] || STATUS.pass;
        var slug = esc(s.slug || "scenario");
        var title = esc(s.title || s.slug || "Scenario");
        var observed = s.observed ? '<span class="observed">— ' + esc(s.observed) + "</span>" : "";
        html += '<li><span class="status status-' + st.cls + '">' + st.label + "</span>";
        html += '<a href="#' + slug + '">' + title + "</a>" + observed + "</li>";
      });
      html += "</ul></div>";
    }

    // TOC
    html += '<nav class="toc" aria-label="Scenarios"><h2>Scenarios</h2><ol>';
    scenarios.forEach(function (s, i) {
      var slug = esc(s.slug || "scenario-" + (i + 1));
      var title = esc(s.title || s.slug || "Scenario " + (i + 1));
      var dur = (typeof s.duration_seconds === "number") ? Math.round(s.duration_seconds) + "s" : "";
      var st = STATUS[s.status] || STATUS.pass;
      html += "<li>";
      html += '<span class="toc-num">' + pad2(i + 1) + "</span>";
      html += '<span class="status status-' + st.cls + '">' + st.label + "</span>";
      html += '<a class="toc-link" href="#' + slug + '">' + title + "</a>";
      html += '<span class="toc-duration">' + (dur || "") + "</span>";
      html += "</li>";
    });
    html += "</ol></nav>";

    // scenarios stacked
    html += '<div class="scenarios">';
    scenarios.forEach(function (s) {
      html += renderScenario(s);
    });
    html += "</div>";

    // next step
    if (hasIssues) {
      var n = counts.fail + counts["needs-attention"];
      html += '<div class="next-step">';
      html += "<h2>What do you want me to do next?</h2>";
      html += "<p>" + n + " scenario(s) didn't pass cleanly. Two options:</p>";
      html += "<ol>";
      html += "<li><strong>Loop back</strong> — I take the failures and fix the underlying issues, then re-run this skill from scratch.</li>";
      html += "<li><strong>Summary only</strong> — I write up what I found and stop, so you can decide what to do.</li>";
      html += "</ol>";
      html += '<p class="muted">For precise feedback, right-click the <code>#</code> next to any item above, copy the link, and paste it back with what you expected.</p>';
      html += "</div>";
    }

    html += "</div></section>";
    return html;
  }

  try {
    var raw = document.getElementById("metadata").textContent;
    var meta = JSON.parse(raw);
    document.getElementById("root").innerHTML = render(meta);
    if (meta && meta.app && meta.app.name && !meta._placeholder) {
      document.title = "Proof · " + meta.app.name + (meta.run_id ? " · " + meta.run_id : "");
    }
  } catch (e) {
    document.getElementById("root").innerHTML =
      '<div class="error"><h1>Proof</h1><p>Failed to render metadata: ' +
      String(e && e.message ? e.message : e).replace(/</g, "&lt;") + "</p></div>";
  }
})();
</script>

</body>
</html>
