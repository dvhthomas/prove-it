<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prove It</title>
<style>
:root {
  --bg: #fafafa;
  --surface: #ffffff;
  --border: #e5e7eb;
  --rule: #f0f1f3;
  --text: #111827;
  --text-muted: #6b7280;
  --text-dim: #9ca3af;
  --accent: #4f46e5;
  --pass: #16a34a;
  --warn: #0369a1;
  --fail: #dc2626;
  --radius: 6px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 56rem;
  margin: 0 auto;
  padding: 0 1.5rem;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

h1, h2 { color: var(--text); line-height: 1.25; }

code {
  font-family: var(--font-mono);
  font-size: 0.88em;
  color: var(--text-muted);
}

/* ── Top nav ────────────────────────────────────────────────────────── */
.site-nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0.55rem 0;
  position: sticky;
  top: 0;
  z-index: 50;
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}
.nav-logo { font-weight: 600; font-size: 0.95rem; color: var(--text); letter-spacing: -0.01em; }
.nav-logo:hover { text-decoration: none; }
.nav-meta { font-size: 0.78rem; color: var(--text-dim); font-family: var(--font-mono); }

/* ── Hero — title + status text on one line ─────────────────────────── */
.hero { padding: 1.6rem 0 1rem; }
.hero h1 {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.015em;
  margin: 0;
  display: inline;
}
.app-version {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--text-dim);
  font-weight: 400;
  margin-left: 0.5rem;
}
.hero-status {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  margin-left: 0.85rem;
  font-size: 0.85rem;
  font-weight: 500;
  vertical-align: 1px;
}
.env-line {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--text-dim);
  margin: 0.4rem 0 0;
}
.env-line .env-app {
  font-family: var(--font);
  font-weight: 600;
  color: var(--text);
  font-size: 0.88rem;
}

/* ── Status balls ─ no inline text, color carries the signal ────────── */
.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
  vertical-align: -1px;
}
.dot.status-pass { background: var(--pass); }
.dot.status-warn { background: var(--warn); }
.dot.status-fail { background: var(--fail); }

/* hero summary still has tiny text alongside its dot — it's the count */
.hero-status .dot { width: 9px; height: 9px; vertical-align: 0; }
.hero-status.status-pass { color: var(--pass); }
.hero-status.status-warn { color: var(--warn); }
.hero-status.status-fail { color: var(--fail); }

/* ── Legend — defines the three colors once, small and quiet ────────── */
.legend {
  display: flex;
  align-items: center;
  gap: 1.1rem;
  font-size: 0.78rem;
  color: var(--text-muted);
  margin: 1.5rem 0 0.7rem;
  flex-wrap: wrap;
}
.legend .legend-key {
  font-size: 0.68rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text-dim);
}
.legend .legend-item {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}
.legend .legend-item.status-pass { color: var(--pass); }
.legend .legend-item.status-warn { color: var(--warn); }
.legend .legend-item.status-fail { color: var(--fail); }

/* ── Section labels ─────────────────────────────────────────────────── */
.section-label {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--text-muted);
  margin: 1.6rem 0 0.65rem;
}

/* ── Overview table — the lead, all scenarios in one place ──────────── */
.overview {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.93rem;
}
.overview th, .overview td {
  text-align: left;
  vertical-align: top;
  padding: 0.6rem 0.75rem 0.6rem 0;
}
.overview th {
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.4rem;
}
.overview td { border-bottom: 1px solid var(--rule); }
.overview tr.row-hypothesis td { border-bottom: 1px solid var(--rule); padding-top: 0; padding-bottom: 0.7rem; }
.overview tr.row + tr.row-hypothesis td { border-top: none; }
.overview tr.row td { border-bottom: none; padding-bottom: 0.35rem; }
.overview tr.row + tr.row td { padding-top: 0.7rem; border-top: 1px solid var(--rule); }
.overview tr.row-hypothesis + tr.row td { padding-top: 0.7rem; border-top: 1px solid var(--rule); }

.overview td.num { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-dim); width: 2.2rem; }
.overview td.col-status { width: 1.5rem; text-align: center; padding-right: 0.6rem; }
.overview th.col-status { text-align: center; padding-right: 0.6rem; }
.overview td.col-title a { color: var(--text); }
.overview td.col-title a:hover { color: var(--accent); text-decoration: none; }
.overview td.col-duration {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--text-dim);
  width: 4rem;
  text-align: right;
}
.overview td.col-action { width: 7rem; text-align: right; padding-right: 0; }

.overview tr.row-hypothesis td.spacer { padding: 0; }
.overview tr.row-hypothesis td.hypo {
  color: var(--text);
  font-size: 0.88rem;
  padding-left: 0;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  line-clamp: 3;
  overflow: hidden;
  text-overflow: ellipsis;
}
.overview tr.row-hypothesis td.hypo .hypo-label {
  font-size: 0.68rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-right: 0.5rem;
}
.overview tr.row-hypothesis td.hypo .hypo-label.status-warn { color: var(--warn); }
.overview tr.row-hypothesis td.hypo .hypo-label.status-fail { color: var(--fail); }

/* evidence sub-row — quick jumps to video/screenshots in the detail card */
.overview tr.row-evidence td { padding-top: 0; padding-bottom: 0.7rem; border-bottom: none; border-top: none; }
.overview tr.row-evidence + tr.row td { padding-top: 0.7rem; border-top: 1px solid var(--rule); }
.overview tr.row-evidence td.evidence {
  font-size: 0.82rem;
  color: var(--text-muted);
  padding-left: 0;
}
.overview tr.row-evidence td.evidence .ev-label {
  font-size: 0.68rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  margin-right: 0.5rem;
}
.overview tr.row-evidence td.evidence a {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--accent);
  margin-right: 0.4rem;
}
.overview tr.row-evidence td.evidence a + a::before {
  content: "·";
  color: var(--text-dim);
  margin-right: 0.4rem;
}

@media (max-width: 700px) {
  .overview td.col-status { width: auto; }
  .overview td.col-duration { display: none; }
  .overview th.col-duration { display: none; }
  .overview td.col-action { width: auto; }
  .overview tr.row-hypothesis td.hypo { padding-left: 2.2rem; }
}

/* ── Copy link — small icon-only button ─────────────────────────────── */
.copy-link-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  color: var(--text-dim);
  border-radius: 4px;
  width: 1.5rem;
  height: 1.5rem;
  padding: 0;
  cursor: pointer;
  transition: color 0.12s, background 0.12s;
  vertical-align: middle;
}
.copy-link-btn svg { width: 14px; height: 14px; display: block; }
.copy-link-btn:hover { color: var(--accent); background: var(--rule); }
.copy-link-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.copy-link-btn.copied { color: var(--accent); }
.copy-link-btn.copied svg { animation: copy-pop 0.32s ease; }
@keyframes copy-pop { 0% { transform: scale(1); } 50% { transform: scale(1.25); } 100% { transform: scale(1); } }

/* permalink (anchor #) */
.permalink {
  color: var(--text-dim);
  font-weight: 500;
  font-size: 0.85em;
  font-family: var(--font-mono);
  text-decoration: none;
  opacity: 0.5;
  transition: opacity 0.12s, color 0.12s;
  padding: 0 0.15rem;
}
.permalink:hover, .permalink:focus { opacity: 1; color: var(--accent); text-decoration: none; }

/* ── Scenario detail — light card, tables inside ────────────────────── */
.scenarios { margin: 0 0 1.5rem; }
.scenario {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.1rem 1.4rem;
  margin: 0 0 1rem;
  scroll-margin-top: 4.5rem;
}
.scenario:target {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgb(79 70 229 / 0.12);
}
.scenario-head {
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  flex-wrap: wrap;
  margin: 0 0 0.6rem;
}
.scenario-head h2 {
  font-size: 1.05rem;
  font-weight: 600;
  margin: 0;
  flex: 1 1 auto;
  min-width: 0;
}
.scenario-head .duration {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--text-dim);
}
.narrative {
  margin: 0 0 0.6rem;
  color: var(--text);
  font-size: 0.93rem;
}

/* numbered steps inside scenario card — limited chrome */
.steps { margin: 0.6rem 0 0.8rem; }
.step { margin: 0.7rem 0 0; }
.step:first-child { margin-top: 0; }
.step h3 {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin: 0 0 0.2rem;
}
.step h3 .step-num {
  display: inline-block;
  width: 1.3rem;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-weight: 500;
}
.step h3.status-warn { color: var(--warn); }
.step h3.status-fail { color: var(--fail); }
.step p { margin: 0; font-size: 0.93rem; color: var(--text); padding-left: 1.3rem; }

/* video */
.video-figure { margin: 0.9rem 0 0.5rem; scroll-margin-top: 4.5rem; }
.video-figure video {
  width: 100%;
  max-width: 56rem;
  display: block;
  background: #000;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.video-figure figcaption {
  font-size: 0.76rem;
  color: var(--text-muted);
  margin-top: 0.3rem;
  display: flex;
  align-items: center;
  gap: 0.25rem;
}
.video-figure:target video { outline: 2px solid var(--accent); outline-offset: 2px; }

/* screenshots */
.shots {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 0.7rem;
  margin: 0.7rem 0 0.4rem;
}
.shot { margin: 0; scroll-margin-top: 4.5rem; }
.shot a { display: block; }
.shot img {
  width: 100%;
  aspect-ratio: 16 / 10;
  object-fit: contain;
  display: block;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: border-color 0.12s ease;
  color: transparent;
}
.shot a:hover img { border-color: var(--text-dim); }
.shot:target img {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgb(79 70 229 / 0.18);
}
.shot figcaption {
  font-size: 0.76rem;
  color: var(--text-muted);
  margin-top: 0.3rem;
  display: flex;
  align-items: center;
  gap: 0.25rem;
}

/* notes */
.notes {
  margin: 0.7rem 0 0;
  padding-top: 0.55rem;
  border-top: 1px solid var(--rule);
  font-size: 0.85rem;
  color: var(--text-muted);
}
.notes strong { color: var(--text); font-weight: 600; }

.paste-hint {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin: 0.85rem 0 0;
}

.empty, .error { text-align: center; padding: 3rem 1rem; }
.empty h1, .error h1 {
  font-size: 1.75rem;
  font-weight: 700;
  letter-spacing: -0.015em;
  margin: 0 0 0.5rem;
}
.empty p, .error p { color: var(--text-muted); max-width: 36rem; margin: 0 auto; font-size: 0.92rem; }
.empty code, .error code { display: inline-block; margin-top: 0.5rem; }
.error p { color: var(--fail); }

footer {
  border-top: 1px solid var(--border);
  padding: 1.25rem 0;
  text-align: center;
  font-size: 0.78rem;
  color: var(--text-dim);
  margin-top: 2rem;
}

/* lightbox */
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(17, 24, 39, 0.92);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 1.5rem;
  animation: lb-fade 0.12s ease;
}
.lightbox.open { display: flex; }
@keyframes lb-fade { from { opacity: 0; } to { opacity: 1; } }
.lb-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.75rem;
  max-width: 100%;
  max-height: 100%;
}
.lb-img {
  max-width: min(95vw, 1280px);
  max-height: 78vh;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: var(--radius);
  background: var(--bg);
  box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
}
.lb-caption {
  color: rgba(255, 255, 255, 0.92);
  font-size: 0.95rem;
  text-align: center;
  max-width: 70ch;
  line-height: 1.4;
}
.lb-counter {
  color: rgba(255, 255, 255, 0.55);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.04em;
}
.lb-btn {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.18);
  color: rgba(255, 255, 255, 0.92);
  border-radius: 999px;
  width: 2.6rem;
  height: 2.6rem;
  font-size: 1.4rem;
  font-family: var(--font);
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.12s, border-color 0.12s;
  position: absolute;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
.lb-btn:hover:not([disabled]) {
  background: rgba(255, 255, 255, 0.2);
  border-color: rgba(255, 255, 255, 0.32);
}
.lb-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lb-btn[disabled] { opacity: 0.3; cursor: default; }
.lb-close { top: 1rem; right: 1rem; }
.lb-prev  { top: 50%; left: 1rem;  transform: translateY(-50%); }
.lb-next  { top: 50%; right: 1rem; transform: translateY(-50%); }

@media (max-width: 700px) {
  .lb-prev { left: 0.5rem; }
  .lb-next { right: 0.5rem; }
  .lb-img  { max-height: 70vh; }
}

@media (max-width: 768px) {
  .hero { padding: 1.25rem 0 0.85rem; }
  .hero h1 { font-size: 1.35rem; }
  .scenario { padding: 0.95rem 1.05rem; }
}

.toast {
  position: fixed;
  bottom: 1.25rem;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--text);
  color: white;
  padding: 0.5rem 0.9rem;
  border-radius: var(--radius);
  font-size: 0.85rem;
  box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.25);
  opacity: 0;
  transition: opacity 0.18s, transform 0.18s;
  pointer-events: none;
  z-index: 200;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="site-nav">
  <div class="container nav-inner">
    <a href="#top" class="nav-logo">Prove It</a>
    <span class="nav-meta" id="navRun"></span>
  </div>
</header>

<main id="top">
  <div id="root"><div class="empty"><h1>Prove It</h1><p>Loading…</p></div></div>
</main>

<footer>
  <div class="container">
    <p>Generated by the <a href="https://github.com/dvhthomas/prove-it">prove-it</a> skill. Open via <code>file://</code> — no server required.</p>
  </div>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Screenshot viewer" aria-hidden="true">
  <button class="lb-btn lb-close" id="lbClose" type="button" aria-label="Close (Esc)">×</button>
  <button class="lb-btn lb-prev"  id="lbPrev"  type="button" aria-label="Previous (←)">‹</button>
  <div class="lb-stage">
    <img class="lb-img" id="lbImg" alt="">
    <div class="lb-caption" id="lbCaption"></div>
    <div class="lb-counter" id="lbCounter"></div>
  </div>
  <button class="lb-btn lb-next" id="lbNext" type="button" aria-label="Next (→)">›</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="application/json" id="metadata">
{
  "_placeholder": true,
  "run_id": "(not yet populated)",
  "app": { "name": "Prove It", "version": "", "url_or_command": "" },
  "environment": { "os": "", "browser": "" },
  "scenarios": []
}
</script>

<script>
(function () {
  "use strict";

  var STATUS = {
    "pass":            { cls: "pass", label: "seems to work", noun: "seems to work", plural: "seem to work" },
    "needs-attention": { cls: "warn", label: "learning",      noun: "learning",      plural: "learnings" },
    "fail":            { cls: "fail", label: "problem",       noun: "problem",       plural: "problems" }
  };

  function esc(s) {
    if (s == null) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function permalink(anchor, label) {
    return '<a class="permalink" href="#' + esc(anchor) + '" title="Copy link to this ' + esc(label) + '">#</a>';
  }

  var COPY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>';

  function copyBtn(anchor, label) {
    var t = "Copy link to this " + label + " — paste into chat with what you expected";
    return '<button type="button" class="copy-link-btn" data-anchor="' + esc(anchor) +
           '" aria-label="' + esc(t) + '" title="' + esc(t) + '">' + COPY_SVG + '</button>';
  }

  function statusDot(status) {
    var st = STATUS[status] || STATUS.pass;
    var label = esc(st.label);
    return '<span class="dot status-' + st.cls + '" role="img" aria-label="' + label + '" title="' + label + '"></span>';
  }

  function statusCls(status) {
    var st = STATUS[status] || STATUS.pass;
    return st.cls;
  }

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  function renderEmpty() {
    return (
      '<div class="empty">' +
      '<h1>Prove It</h1>' +
      '<p>This is the bare viewer template. Replace the JSON inside ' +
      '<code>&lt;script type="application/json" id="metadata"&gt;</code> ' +
      "with your run's real metadata, then reload.</p>" +
      "</div>"
    );
  }

  function renderOverviewRow(s, i) {
    var slug = esc(s.slug || "scenario-" + (i + 1));
    var title = esc(s.title || s.slug || "Scenario " + (i + 1));
    var hypothesis = esc(s.hypothesis || "");
    var nonPass = s.status !== "pass";
    var sCls = statusCls(s.status);

    var html = '<tr class="row">';
    html += '<td class="num">' + pad2(i + 1) + '</td>';
    html += '<td class="col-status">' + statusDot(s.status) + '</td>';
    html += '<td class="col-title"><a href="#' + slug + '">' + title + '</a></td>';
    html += '<td class="col-action">' + (nonPass ? copyBtn(slug, "finding") : "") + '</td>';
    html += '</tr>';

    if (nonPass && hypothesis) {
      html += '<tr class="row-hypothesis">';
      html += '<td class="spacer"></td>';
      html += '<td class="hypo" colspan="3"><span class="hypo-label status-' + sCls + '">Hypothesis</span>' + hypothesis + '</td>';
      html += '</tr>';
    }
    return html;
  }

  function renderScenario(s) {
    var slug = esc(s.slug || "scenario");
    var title = esc(s.title || s.slug || "Scenario");
    var narrative = esc(s.narrative || "");
    var notes = esc(s.notes || "");
    var expected = esc(s.expected || "");
    var observed = esc(s.observed || "");
    var hypothesis = esc(s.hypothesis || "");
    var dur = (typeof s.duration_seconds === "number") ? Math.round(s.duration_seconds) + "s" : "";

    var sCls = statusCls(s.status);

    var html = '<article class="scenario" id="' + slug + '">';
    html += '<header class="scenario-head">';
    html += statusDot(s.status);
    html += '<h2>' + title + '</h2>';
    if (dur) html += '<span class="duration">' + dur + '</span>';
    html += copyBtn(slug, "scenario");
    html += permalink(slug, "scenario");
    html += '</header>';

    // numbered steps: 1. Action, 2. Expected, 3. Observed, 4. Hypothesis (if any)
    var steps = [];
    if (narrative)  steps.push({ label: "Action",     body: narrative });
    if (expected)   steps.push({ label: "Expected",   body: expected });
    if (observed)   steps.push({ label: "Observed",   body: observed });
    if (hypothesis) steps.push({ label: "Hypothesis", body: hypothesis, cls: "status-" + sCls });
    if (steps.length) {
      html += '<div class="steps">';
      steps.forEach(function (st, idx) {
        var clsAttr = st.cls ? ' class="' + st.cls + '"' : "";
        html += '<section class="step">';
        html += '<h3' + clsAttr + '><span class="step-num">' + (idx + 1) + '.</span>' + st.label + '</h3>';
        html += '<p>' + st.body + '</p>';
        html += '</section>';
      });
      html += '</div>';
    }

    if (s.video) {
      var v = esc(s.video);
      var vId = slug + "--video";
      html += '<figure id="' + vId + '" class="video-figure">';
      html += '<video controls preload="metadata" src="' + v + '">';
      html += 'Your browser cannot play this video. Open <a href="' + v + '">' + v + '</a> directly.';
      html += '</video>';
      html += '<figcaption><span>Video</span> ' + permalink(vId, "video") + '</figcaption>';
      html += '</figure>';
    }

    var shots = s.screenshots || [];
    if (shots.length) {
      html += '<div class="shots">';
      shots.forEach(function (shot, i) {
        var file = esc(shot.file || "");
        var caption = esc(shot.caption || "");
        var sid = slug + "--shot-" + pad2(i + 1);
        html += '<figure class="shot" id="' + sid + '">';
        html += '<a href="' + file + '" target="_blank" aria-label="Open screenshot: ' + caption + '">';
        html += '<img src="' + file + '" alt="" loading="lazy"></a>';
        html += '<figcaption><span>' + caption + '</span> ' + permalink(sid, "screenshot") + '</figcaption>';
        html += '</figure>';
      });
      html += '</div>';
    }

    if (notes) html += '<p class="notes"><strong>Notes:</strong> ' + notes + '</p>';
    html += '</article>';
    return html;
  }

  function render(meta) {
    var scenarios = (meta && meta.scenarios) || [];
    if (meta && meta._placeholder) return renderEmpty();
    if (!scenarios.length) return renderEmpty();

    var counts = { pass: 0, "needs-attention": 0, fail: 0 };
    scenarios.forEach(function (s) {
      if (counts[s.status] != null) counts[s.status]++;
    });

    var overall;
    if (counts.fail) {
      overall = { cls: "fail", label: counts.fail + " " + (counts.fail === 1 ? "problem" : "problems") };
    } else if (counts["needs-attention"]) {
      var n = counts["needs-attention"];
      overall = { cls: "warn", label: n + " " + (n === 1 ? "learning" : "learnings") };
    } else {
      overall = { cls: "pass", label: scenarios.length === 1 ? "seems to work" : "all " + scenarios.length + " seem to work" };
    }

    var app = meta.app || {};
    var env = meta.environment || {};
    var hasIssues = counts.fail + counts["needs-attention"] > 0;

    var navRun = document.getElementById("navRun");
    if (navRun) navRun.textContent = meta.run_id ? "run · " + meta.run_id : "";

    var html = "";

    // ── Hero — H1 is the app being proved; "Prove It" identity lives in the nav
    html += '<section class="hero"><div class="container">';
    html += '<h1>' + esc(app.name || "Prove It") + '</h1>';
    if (app.version) html += '<span class="app-version">' + esc(app.version) + '</span>';
    html += '<span class="hero-status status-' + overall.cls + '"><span class="dot"></span>' + esc(overall.label) + '</span>';

    var envBits = [];
    if (env.os) envBits.push(esc(env.os));
    if (env.browser) envBits.push(esc(env.browser));
    if (meta.run_id) envBits.push('run <code>' + esc(meta.run_id) + '</code>');
    if (envBits.length) html += '<p class="env-line">' + envBits.join(' · ') + '</p>';
    html += '</div></section>';

    html += '<section><div class="container">';

    // ── Legend — defines the three colors once
    html += '<div class="legend">';
    html += '<span class="legend-key">Key</span>';
    html += '<span class="legend-item status-fail"><span class="dot status-fail"></span>problems</span>';
    html += '<span class="legend-item status-warn"><span class="dot status-warn"></span>learnings</span>';
    html += '<span class="legend-item status-pass"><span class="dot status-pass"></span>seems to work</span>';
    html += '</div>';

    // ── Single overview table — every scenario, with hypothesis sub-row for non-pass
    html += '<table class="overview">';
    html += '<thead><tr>';
    html += '<th></th>';
    html += '<th class="col-status" aria-label="Status"></th>';
    html += '<th>Scenario</th>';
    html += '<th></th>';
    html += '</tr></thead>';
    html += '<tbody>';
    scenarios.forEach(function (s, i) { html += renderOverviewRow(s, i); });
    html += '</tbody></table>';

    // ── Scenario detail cards (full steps + media, anchored)
    html += '<div class="scenarios">';
    scenarios.forEach(function (s) { html += renderScenario(s); });
    html += '</div>';

    html += "</div></section>";
    return html;
  }

  // ── Lightbox ───────────────────────────────────────────────────────────
  var lb = {
    el:      document.getElementById("lightbox"),
    img:     document.getElementById("lbImg"),
    caption: document.getElementById("lbCaption"),
    counter: document.getElementById("lbCounter"),
    closeBtn:document.getElementById("lbClose"),
    prevBtn: document.getElementById("lbPrev"),
    nextBtn: document.getElementById("lbNext"),
    shots:   [],
    index:   0,
    prevOverflow: ""
  };

  function lbShow() {
    if (!lb.shots.length) return;
    var fig = lb.shots[lb.index];
    var imgEl = fig.querySelector("img");
    var capEl = fig.querySelector("figcaption span");
    lb.img.src = imgEl ? imgEl.src : "";
    lb.caption.textContent = capEl ? capEl.textContent : "";
    lb.counter.textContent = (lb.index + 1) + " / " + lb.shots.length;
    lb.prevBtn.disabled = lb.index === 0;
    lb.nextBtn.disabled = lb.index === lb.shots.length - 1;
    var fid = fig.id;
    if (fid && location.hash !== "#" + fid) {
      history.replaceState(null, "", "#" + fid);
    }
  }

  function lbOpen(shots, idx) {
    lb.shots = Array.prototype.slice.call(shots);
    lb.index = idx;
    lbShow();
    lb.el.classList.add("open");
    lb.el.setAttribute("aria-hidden", "false");
    lb.prevOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    lb.closeBtn.focus();
  }

  function lbClose() {
    lb.el.classList.remove("open");
    lb.el.setAttribute("aria-hidden", "true");
    document.body.style.overflow = lb.prevOverflow;
  }

  function lbNext() { if (lb.index < lb.shots.length - 1) { lb.index++; lbShow(); } }
  function lbPrev() { if (lb.index > 0) { lb.index--; lbShow(); } }

  function attachLightbox() {
    document.querySelectorAll(".shot a").forEach(function (a) {
      a.addEventListener("click", function (e) {
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
        e.preventDefault();
        var fig = a.closest(".shot");
        var scenario = a.closest(".scenario");
        if (!fig || !scenario) return;
        var shots = scenario.querySelectorAll(".shot");
        var idx = Array.prototype.indexOf.call(shots, fig);
        if (idx < 0) return;
        lbOpen(shots, idx);
      });
    });
    lb.closeBtn.addEventListener("click", lbClose);
    lb.prevBtn.addEventListener("click", lbPrev);
    lb.nextBtn.addEventListener("click", lbNext);
    lb.el.addEventListener("click", function (e) { if (e.target === lb.el) lbClose(); });
    window.addEventListener("keydown", function (e) {
      if (!lb.el.classList.contains("open")) return;
      if (e.key === "Escape")          { e.preventDefault(); lbClose(); }
      else if (e.key === "ArrowRight") { e.preventDefault(); lbNext(); }
      else if (e.key === "ArrowLeft")  { e.preventDefault(); lbPrev(); }
    });
  }

  // ── Copy-link buttons ──────────────────────────────────────────────────
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function flashToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1600);
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    ta.style.pointerEvents = "none";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(
        function () { return true; },
        function () { return fallbackCopy(text); }
      );
    }
    return Promise.resolve(fallbackCopy(text));
  }

  function attachCopyButtons() {
    document.querySelectorAll(".copy-link-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var anchor = btn.getAttribute("data-anchor") || "";
        var base = window.location.href.split("#")[0];
        var url = base + (anchor ? "#" + anchor : "");
        Promise.resolve(copyToClipboard(url)).then(function (ok) {
          if (ok) {
            btn.classList.add("copied");
            var orig = btn.innerHTML;
            btn.innerHTML = CHECK_SVG;
            flashToast("Link copied — paste into chat with what you expected");
            setTimeout(function () {
              btn.classList.remove("copied");
              btn.innerHTML = orig;
            }, 1600);
          } else {
            flashToast("Couldn't copy — select the URL bar and copy manually");
          }
        });
      });
    });
  }

  try {
    var raw = document.getElementById("metadata").textContent;
    var meta = JSON.parse(raw);
    document.getElementById("root").innerHTML = render(meta);
    if (meta && meta.app && meta.app.name && !meta._placeholder) {
      document.title = "Prove It · " + meta.app.name + (meta.run_id ? " · " + meta.run_id : "");
    }
    attachLightbox();
    attachCopyButtons();
  } catch (e) {
    document.getElementById("root").innerHTML =
      '<div class="error"><h1>Prove It</h1><p>Failed to render metadata: ' +
      String(e && e.message ? e.message : e).replace(/</g, "&lt;") + "</p></div>";
  }
})();
</script>

</body>
</html>
